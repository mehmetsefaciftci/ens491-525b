<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compile AR target</title>
  <script type="importmap">
  { "imports": { "mindar-image": "../vendor/mind-ar/mindar-image.prod.js" } }
  </script>
</head>
<body>
  <!-- Compiles ../targets/<img> into a MindAR .mind file so phones skip the slow in-browser step.
       With `node tools/dev-server.mjs`: open /tools/compile-target.html?img=artwork.jpg&save=1
       and the file is written to targets/artwork.mind. Otherwise use the download link. -->
  <p id="status">compiling…</p>
  <a id="dl" hidden>download .mind</a>
  <script type="module">
    import { Compiler } from "mindar-image";
    // ?img=a.jpg            -> targets/a.mind (one artwork)
    // ?imgs=a.jpg,b.jpg&out=targets.mind -> one file with several targets, in this order
    //   (the order must match content/artworks.json)
    const q = new URLSearchParams(location.search);
    const names = (q.get("imgs") || q.get("img") || "placeholder.jpg").split(",");
    const imgs = [];
    for (const n of names) { const im = new Image(); im.src = `../targets/${n}`; await im.decode(); imgs.push(im); }
    const compiler = new Compiler();
    await compiler.compileImageTargets(imgs, (p) => (document.querySelector("#status").textContent = `compiling ${names.length} image(s): ${p.toFixed(0)}%`));
    const data = await compiler.exportData();
    const a = document.querySelector("#dl");
    a.href = URL.createObjectURL(new Blob([data])); a.download = q.get("out") || names[0].replace(/\.\w+$/, ".mind"); a.hidden = false;
    let saved = "";
    if (new URLSearchParams(location.search).has("save")) {   // only works with tools/dev-server.mjs
      const r = await fetch(`../targets/${a.download}`, { method: "PUT", body: data });
      saved = r.ok ? ` · saved to targets/${a.download}` : ` · save failed (${r.status})`;
    }
    document.querySelector("#status").textContent = `done: ${data.length} bytes${saved}`;
  </script>
</body>
</html>
